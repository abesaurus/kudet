<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF41"/>
      <stop offset="100%" stop-color="#00b32e"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0b"/>
      <stop offset="100%" stop-color="#0c120d"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0f0b"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" rx="48" fill="url(#bg)"/>

  <!-- grid dots -->
  <g fill="#0d1f12" opacity="0.6">
    <circle cx="20" cy="20" r="1.2"/><circle cx="60" cy="20" r="1.2"/><circle cx="100" cy="20" r="1.2"/>
    <circle cx="140" cy="20" r="1.2"/><circle cx="180" cy="20" r="1.2"/><circle cx="220" cy="20" r="1.2"/>
    <circle cx="20" cy="60" r="1.2"/><circle cx="220" cy="60" r="1.2"/><circle cx="20" cy="100" r="1.2"/>
    <circle cx="220" cy="100" r="1.2"/><circle cx="20" cy="140" r="1.2"/><circle cx="220" cy="140" r="1.2"/>
    <circle cx="20" cy="180" r="1.2"/><circle cx="220" cy="180" r="1.2"/><circle cx="20" cy="220" r="1.2"/>
    <circle cx="60" cy="220" r="1.2"/><circle cx="100" cy="220" r="1.2"/><circle cx="140" cy="220" r="1.2"/>
    <circle cx="180" cy="220" r="1.2"/><circle cx="220" cy="220" r="1.2"/>
  </g>

  <!-- outer ring -->
  <circle cx="120" cy="110" r="80" fill="none" stroke="url(#card)" stroke-width="10" opacity="0.9" filter="url(#glow)"/>

  <!-- card body -->
  <rect x="48" y="74" width="144" height="92" rx="14" fill="url(#card2)" stroke="#00FF41" stroke-width="2.5" filter="url(#glow)"/>

  <!-- hybrid H: crypto + fiat split -->
  <g stroke="#00FF41" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M78 96 L78 144"/>
    <path d="M106 96 L106 144"/>
    <path d="M92 96 L92 120 L92 144"/>
  </g>
  <!-- H crossbar -->
  <line x1="78" y1="120" x2="106" y2="120" stroke="#00FF41" stroke-width="8" stroke-linecap="round"/>

  <!-- coin circles (cash) -->
  <circle cx="150" cy="104" r="13" fill="none" stroke="#00FF41" stroke-width="4"/>
  <circle cx="150" cy="104" r="5" fill="#00FF41"/>
  <circle cx="172" cy="104" r="13" fill="none" stroke="#00FF41" stroke-width="4"/>
  <circle cx="172" cy="104" r="5" fill="#00FF41"/>

  <!-- chip -->
  <rect x="148" y="130" width="26" height="20" rx="4" fill="none" stroke="#00FF41" stroke-width="2.5" opacity="0.9"/>
  <line x1="161" y1="130" x2="161" y2="150" stroke="#00FF41" stroke-width="1.5" opacity="0.7"/>
  <line x1="148" y1="140" x2="174" y2="140" stroke="#00FF41" stroke-width="1.5" opacity="0.7"/>

  <!-- label -->
  <g font-family="DejaVu Sans Mono, monospace" font-weight="bold" text-anchor="middle">
    <text x="120" y="196" font-size="20" fill="#00FF41" letter-spacing="3">HCASH</text>
  </g>
  <rect x="52" y="208" width="136" height="2" fill="#00FF41" opacity="0.35"/>
</svg>