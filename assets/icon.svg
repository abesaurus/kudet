<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF41"/>
      <stop offset="100%" stop-color="#00c93a"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0b"/>
      <stop offset="100%" stop-color="#0c120d"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0f0b"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" rx="48" fill="url(#bg)"/>
  <!-- grid dots -->
  <g fill="#0d1f12" opacity="0.5">
    <circle cx="20" cy="20" r="1.2"/><circle cx="60" cy="20" r="1.2"/><circle cx="100" cy="20" r="1.2"/>
    <circle cx="140" cy="20" r="1.2"/><circle cx="180" cy="20" r="1.2"/><circle cx="220" cy="20" r="1.2"/>
    <circle cx="20" cy="60" r="1.2"/><circle cx="220" cy="60" r="1.2"/><circle cx="20" cy="100" r="1.2"/>
    <circle cx="220" cy="100" r="1.2"/><circle cx="20" cy="140" r="1.2"/><circle cx="220" cy="140" r="1.2"/>
    <circle cx="20" cy="180" r="1.2"/><circle cx="220" cy="180" r="1.2"/><circle cx="20" cy="220" r="1.2"/>
    <circle cx="60" cy="220" r="1.2"/><circle cx="100" cy="220" r="1.2"/><circle cx="140" cy="220" r="1.2"/>
    <circle cx="180" cy="220" r="1.2"/><circle cx="220" cy="220" r="1.2"/>
  </g>
  <!-- outer ring -->
  <circle cx="120" cy="110" r="80" fill="none" stroke="url(#g)" stroke-width="9" opacity="0.85" filter="url(#glow)"/>
  <circle cx="120" cy="110" r="80" fill="none" stroke="url(#g)" stroke-width="2.5" opacity="0.5"/>
  <!-- card body -->
  <rect x="48" y="74" width="144" height="92" rx="14" fill="url(#card)" stroke="url(#g)" stroke-width="2.2" filter="url(#glow)"/>
  <!-- chip -->
  <rect x="60" y="86" width="26" height="18" rx="3.5" fill="none" stroke="url(#g)" stroke-width="1.8" opacity="0.8"/>
  <line x1="60" y1="95" x2="86" y2="95" stroke="url(#g)" stroke-width="1" opacity="0.5"/>
  <!-- H monogram -->
  <g stroke="url(#g)" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M100 96 L100 142"/>
    <path d="M140 96 L140 142"/>
    <line x1="100" y1="119" x2="140" y2="119"/>
  </g>
  <!-- coin circles -->
  <circle cx="84" cy="126" r="14" fill="none" stroke="url(#g)" stroke-width="3.5"/>
  <circle cx="84" cy="126" r="5" fill="url(#g)"/>
  <circle cx="110" cy="126" r="14" fill="none" stroke="url(#g)" stroke-width="3.5"/>
  <circle cx="110" cy="126" r="5" fill="url(#g)"/>
  <!-- label -->
  <g font-family="'JetBrains Mono',monospace" font-weight="bold" text-anchor="middle" letter-spacing="2">
    <text x="120" y="196" font-size="19" fill="#F5F5F5">HCASH</text>
  </g>
  <rect x="52" y="208" width="136" height="1.5" fill="url(#g)" opacity="0.3"/>
</svg>