<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF41"/><stop offset="100%" stop-color="#00c93a"/>
    </linearGradient>
    <linearGradient id="cardg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c120d"/><stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="f"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="120" fill="transparent"/>
  <!-- ring -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#g)" stroke-width="6" filter="url(#f)"/>
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.5"/>
  <!-- card -->
  <rect x="28" y="40" width="64" height="42" rx="9" fill="url(#cardg)" stroke="url(#g)" stroke-width="1.6"/>
  <rect x="34" y="46" width="18" height="13" rx="2.5" fill="none" stroke="url(#g)" stroke-width="1.2" opacity="0.85"/>
  <line x1="36" y1="53" x2="50" y2="53" stroke="url(#g)" stroke-width="0.8" opacity="0.6"/>
  <!-- H monogram -->
  <g stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M42 50 L42 72"/><path d="M54 50 L54 72"/><line x1="42" y1="61" x2="54" y2="61"/>
  </g>
  <!-- coins -->
  <circle cx="72" cy="56" r="5" fill="none" stroke="url(#g)" stroke-width="1.8"/>
  <circle cx="81" cy="56" r="5" fill="none" stroke="url(#g)" stroke-width="1.8"/>
  <text x="73" y="59" font-family="JetBrains Mono, monospace" font-weight="bold" font-size="6" fill="#00FF41">$</text>
  <!-- wordmark -->
  <text x="122" y="66" font-family="JetBrains Mono, monospace" font-weight="bold" font-size="40" fill="#F5F5F5" letter-spacing="4">HYBRID<span fill="#00FF41">CASH</span></text>
  <text x="122" y="92" font-family="JetBrains Mono, monospace" font-size="12" fill="#8A8F98" letter-spacing="8">$HCASH</text>
</svg>
